<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워십프리젠터 출력</title>
<link rel="stylesheet" href="/shared/render.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.opaque { background: #000; }
  body.held { background: transparent !important; }
  body.held > * { visibility: hidden; }
  /* OBS 자막: 그림 슬라이드 우상단 */
  .bc-pip { position: fixed; top: 3vh; right: 2vw; width: 30vw; z-index: 50; border-radius: 1vw; overflow: hidden; box-shadow: 0 0.5vw 2vw rgba(0,0,0,.55); }
  .bc-pip > * { pointer-events: none; }
  body.nocursor, body.nocursor * { cursor: none !important; }
  #screen { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="screen"></div>
<script src="/shared/groups.js"></script>
<script src="/shared/render.js"></script>
<script src="/outputs/output.js"></script>
</body>
</html>
