# 맥 빌드: 애플 서버(GitHub Actions macOS)에서 dmg 를 만들어 해당 버전 릴리스에 올린다
#  - Actions 탭 → mac build → Run workflow → 태그(예: v1.4.0) 입력
#  - 한국어판 · 영어판, Apple Silicon(arm64) · Intel(x64) 각각
#  - 애플 개발자 인증서가 없어 임시 서명(ad-hoc): 처음 열 때 오른쪽 클릭 → 열기 (README 참고)
name: mac build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Korean)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build (English)
        run: npx electron-builder --mac --config build-en.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to release
        run: gh release upload "${{ inputs.tag }}" dist/*.dmg dist-en/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
